<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>历史短视频音频流水线 · 项目</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:960px;margin:0 auto;padding:24px;background:#f6f5f1;color:#2b2b2b}
h1{font-size:22px} nav a{margin-right:16px;color:#7a6a4f;text-decoration:none}
.card{background:#fff;border:1px solid #e3ddcf;border-radius:10px;padding:16px;margin:12px 0}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;background:#eee}
.badge.running{background:#dbeafe}.badge.waiting_review{background:#fef3c7}.badge.done{background:#dcfce7}.badge.error{background:#fee2e2}
textarea,input,select{width:100%;box-sizing:border-box;padding:8px;margin:6px 0;border:1px solid #d6cfbd;border-radius:6px;font-size:14px}
button{padding:8px 20px;border:none;border-radius:6px;background:#7a6a4f;color:#fff;cursor:pointer;font-size:14px}
button:hover{background:#5f5340}
.row{display:flex;gap:12px}.row>div{flex:1}
a.go{color:#7a6a4f}
</style>
</head>
<body>
<h1>📜 历史短视频音频生产流水线</h1>
<nav><a href="/index.html">项目列表</a><a href="/settings.html">模型设置</a><a href="/voices.html">音色库</a></nav>

<div class="card">
<h3>新建任务（N0）</h3>
<div class="row"><div><input id="title" placeholder="任务标题，如：夏桀·第一集"></div>
<div><select id="source_type"><option value="person">人物篇</option><option value="dynasty">朝代篇</option><option value="event">事件篇</option></select></div></div>
<div class="row"><div><input id="target_minutes" type="number" value="10" placeholder="目标时长（分钟）"></div>
<div><input id="episode_no" type="number" value="1" placeholder="集次"></div></div>
<textarea id="prev_bridge" rows="2" placeholder="上集衔接段（第2集起必填）"></textarea>
<textarea id="source_text" rows="8" placeholder="粘贴史料原文……"></textarea>
<button onclick="createProject()">创建并启动流水线</button>
</div>

<div id="list"></div>
<script>
async function load(){
  const r = await fetch('/api/projects'); const ps = await r.json();
  document.getElementById('list').innerHTML = ps.map(p=>`
    <div class="card">
      <b>${p.title}</b> <span class="badge ${p.run_status||''}">${p.run_status||p.status}</span>
      <div style="font-size:13px;color:#888;margin:6px 0">
        ${({person:'人物篇',dynasty:'朝代篇',event:'事件篇'})[p.source_type]} · 第${p.episode_no}集 · ${p.target_minutes}分钟
        ${p.current_node? ' · 当前节点：'+p.current_node : ''}</div>
      ${p.run_id? `<a class="go" href="/run.html?run_id=${p.run_id}">进入工作台 →</a>`
                : `<button onclick="startRun('${p.id}')">启动流水线</button>`}
      <button style="background:#b3402f;margin-left:8px" onclick="delProject('${p.id}','${p.title}')">删除</button>
      ${p.run_status==='error' && p.error ? `<div style="color:#b3402f;font-size:12px;margin-top:6px">⚠ ${p.error}</div>`:''}
    </div>`).join('');
}
async function createProject(){
  const body={title:title.value,source_type:source_type.value,source_text:source_text.value,
    target_minutes:+target_minutes.value,episode_no:+episode_no.value,
    prev_episode_bridge:prev_bridge.value||null};
  const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){alert(d.detail||'创建失败');return;}
  const r2=await fetch(`/api/projects/${d.id}/runs`,{method:'POST'});
  const d2=await r2.json();
  location.href='/run.html?run_id='+d2.run_id;
}
async function delProject(pid,title){
  if(!confirm(`确定删除「${title}」？运行记录、产物文件、checkpoint 将一并清除。`)) return;
  const r=await fetch(`/api/projects/${pid}`,{method:'DELETE'});
  if(r.ok) load(); else alert('删除失败');
}
async function startRun(pid){
  const r=await fetch(`/api/projects/${pid}/runs`,{method:'POST'}); const d=await r.json();
  location.href='/run.html?run_id='+d.run_id;
}
load();
</script>
</body></html>
